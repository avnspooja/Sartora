<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sartora</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  html, body { height: 100%; margin: 0; }
  body { font-family: Georgia, serif; background: #faf8f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .card { background: white; padding: 60px; box-shadow: 0 4px 30px rgba(0,0,0,0.06); width: 100%; height: 100%; max-width: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; box-sizing: border-box; }
  h1 { font-size: 40px; letter-spacing: 3px; margin-bottom: 6px; }
  p.tagline { color: #888; font-size: 15px; margin-bottom: 36px; }
  input { width: 100%; max-width: 360px; padding: 14px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
  button { width: 100%; max-width: 360px; padding: 14px; margin-top: 12px; background: #2b2b2b; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; }
  button:hover { background: #000; }
  #message { margin-top: 16px; font-size: 14px; color: #555; }
</style>
</head>
<body>

<div class="card">
  <h1>SARTORA</h1>
  <p class="tagline">Know what's working. Fix what isn't.</p>

  <input type="email" id="email" placeholder="Email" />
  <input type="password" id="password" placeholder="Password" />

  <button onclick="signUp()">Sign Up</button>
  <button onclick="signIn()">Log In</button>

  <div id="message"></div>
</div>

<script>
  const SUPABASE_URL = "https://jgazsjwkftixnxwqdtzj.supabase.co";
  const SUPABASE_KEY = "sb_publishable_BR7r7PoMonfjAtfErnoa_w_rOtEqK-B";

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  async function signUp() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const { data, error } = await supabase.auth.signUp({ email, password });
    document.getElementById('message').innerText = error ? error.message : "Check your email to confirm your account!";
  }

  async function signIn() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    document.getElementById('message').innerText = error ? error.message : "Logged in! Welcome, " + data.user.email;
  }
</script>

</body>
</html>

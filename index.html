<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sartora</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { font-family: Georgia, serif; background: #faf8f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
  .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 320px; text-align: center; }
  h1 { font-size: 28px; letter-spacing: 2px; margin-bottom: 4px; }
  p.tagline { color: #888; font-size: 13px; margin-bottom: 24px; }
  input { width: 100%; padding: 10px; margin: 6px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
  button { width: 100%; padding: 10px; margin-top: 10px; background: #2b2b2b; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
  button:hover { background: #000; }
  #message { margin-top: 14px; font-size: 13px; color: #555; }
</style>
</head>
<body>

<div class="card">
  <h1>SARTORA</h1>
  <p class="tagline">Know what's working. Fix what isn't.</p>

  <input type="email" id="email" placeholder="Email" />
  <input type="password" id="password" placeholder="Password" />

  <button onclick="signUp()">Sign Up</button>
  <button onclick="signIn()">Log In</button>

  <div id="message"></div>
</div>

<script>
  // ⚠️ Replace these two lines with YOUR values from Supabase
  const SUPABASE_URL = "https://jgazsjwkftixnxwqdtzj.supabase.co/rest/v1/";
  const SUPABASE_KEY = "sb_publishable_BR7r7PoMonfjAtfErnoa_w_rOtEqK-B";

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  async function signUp() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const { data, error } = await supabase.auth.signUp({ email, password });
    document.getElementById('message').innerText = error ? error.message : "Check your email to confirm your account!";
  }

  async function signIn() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    document.getElementById('message').innerText = error ? error.message : "Logged in! Welcome, " + data.user.email;
  }
</script>

</body>
</html>

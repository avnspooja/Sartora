<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sartora</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  html, body { height: 100%; margin: 0; }
  body { font-family: Georgia, serif; background: #faf8f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .card { background: white; padding: 60px; box-shadow: 0 4px 30px rgba(0,0,0,0.06); width: 100%; height: 100%; max-width: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; box-sizing: border-box; }
  h1 { font-size: 40px; letter-spacing: 3px; margin-bottom: 6px; }
  p.tagline { color: #888; font-size: 15px; margin-bottom: 36px; }
  input, textarea { width: 100%; max-width: 360px; padding: 14px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 15px; font-family: inherit; }
  textarea { resize: vertical; min-height: 80px; }
  button { width: 100%; max-width: 360px; padding: 14px; margin-top: 12px; background: #2b2b2b; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; }
  button:hover { background: #000; }
  #message, #upload-message { margin-top: 16px; font-size: 14px; color: #555; }
  #upload-card { display: none; }
  .logout-link { margin-top: 20px; font-size: 13px; color: #999; cursor: pointer; text-decoration: underline; }
  .preview { max-width: 200px; max-height: 200px; margin-top: 12px; border-radius: 6px; display: none; }
</style>
</head>
<body>

<div class="card" id="auth-card">
  <h1>SARTORA</h1>
  <p class="tagline">Know what's working. Fix what isn't.</p>

  <input type="email" id="email" placeholder="Email" />
  <input type="password" id="password" placeholder="Password" />

  <button onclick="signUp()">Sign Up</button>
  <button onclick="signIn()">Log In</button>

  <div id="message"></div>
</div>

<div class="card" id="upload-card">
  <h1>SARTORA</h1>
  <p class="tagline">Upload a post to get feedback</p>

  <input type="file" id="imageFile" accept="image/*" onchange="previewImage()" />
  <img id="previewImg" class="preview" />

  <textarea id="caption" placeholder="Paste the caption for this post..."></textarea>

  <button onclick="uploadPost()">Upload</button>

  <div id="upload-message"></div>

  <div class="logout-link" onclick="signOut()">Log out</div>
</div>

<script>
  const SUPABASE_URL = "https://jgazsjwkftixnxwqdtzj.supabase.co";
  const SUPABASE_KEY = "sb_publishable_BR7r7PoMonfjAtfErnoa_w_rOtEqK-B";

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // Check if already logged in when the page loads
  async function checkSession() {
    const { data } = await supabaseClient.auth.getSession();
    if (data.session) {
      showUploadCard();
    }
  }
  checkSession();

  function showUploadCard() {
    document.getElementById('auth-card').style.display = 'none';
    document.getElementById('upload-card').style.display = 'flex';
  }

  async function signUp() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const { data, error } = await supabaseClient.auth.signUp({ email, password });
    document.getElementById('message').innerText = error ? error.message : "Check your email to confirm your account!";
    if (!error && data.session) showUploadCard();
  }

  async function signIn() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) {
      document.getElementById('message').innerText = error.message;
    } else {
      showUploadCard();
    }
  }

  async function signOut() {
    await supabaseClient.auth.signOut();
    document.getElementById('upload-card').style.display = 'none';
    document.getElementById('auth-card').style.display = 'flex';
  }

  function previewImage() {
    const file = document.getElementById('imageFile').files[0];
    const preview = document.getElementById('previewImg');
    if (file) {
      preview.src = URL.createObjectURL(file);
      preview.style.display = 'block';
    }
  }

  async function uploadPost() {
    const fileInput = document.getElementById('imageFile');
    const caption = document.getElementById('caption').value;
    const file = fileInput.files[0];
    const msgBox = document.getElementById('upload-message');

    if (!file) {
      msgBox.innerText = "Please choose an image first.";
      return;
    }

    msgBox.innerText = "Uploading...";

    // Create a unique file path so uploads don't overwrite each other
    const filePath = `${Date.now()}_${file.name}`;

    const { data: uploadData, error: uploadError } = await supabaseClient
      .storage
      .from('uploads')
      .upload(filePath, file);

    if (uploadError) {
      msgBox.innerText = "Upload failed: " + uploadError.message;
      return;
    }

    // Get the public URL for the uploaded file
    const { data: urlData } = supabaseClient
      .storage
      .from('uploads')
      .getPublicUrl(filePath);

    msgBox.innerText = "Uploaded! (Caption saved: \"" + caption + "\")";
    console.log("Public image URL:", urlData.publicUrl);
  }
</script>

</body>
</html>
